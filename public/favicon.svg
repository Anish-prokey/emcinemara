<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Em Cinema Ra">
  <!--
    A clapperboard: it reads as "movies" at a glance, and holds its shape at
    16px in a browser tab.

    The stripes on the clapper are holes cut out of the bar (evenodd), not red
    lines painted over it. Android 13 themed icons redraw an icon in a single
    colour from its shape alone, and painted stripes would vanish there; holes
    survive. The same path is used for every icon size and platform.
  -->
  <rect width="64" height="64" rx="12" fill="#e50914" />
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M12 21 L50 13 L52 21 L14 29 Z M20 19.32 L24 18.47 L29 25.84 L25 26.68 Z M31 17 L35 16.16 L40 23.53 L36 24.37 Z M42 14.68 L46 13.84 L51 21.21 L47 22.05 Z"
  />
  <path
    fill="#ffffff"
    d="M15 28 H49 A3 3 0 0 1 52 31 V49 A3 3 0 0 1 49 52 H15 A3 3 0 0 1 12 49 V31 A3 3 0 0 1 15 28 Z"
  />
</svg>
